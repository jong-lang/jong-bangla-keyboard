name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/check-docs.py
      - run: python3 -m unittest discover -s tools/tests -v
      - name: Check committed whitespace and release preparation
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/* && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            # Tag-triggered release checks compare the tagged commit to its parent.
            # A root commit has no parent, so compare it to an empty tree.
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD
          # An initial root commit has no previous manifests or changelog.
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base=HEAD
          fi
          python3 tools/check-release.py --base "$base"

  build:
    name: Rust and Fcitx5
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      # Arch supplies the documented Fcitx5 headers; older Ubuntu packages do not.
      - name: Prepare Arch build environment
        run: |
          pacman -Syu --noconfirm --needed git rust cmake ninja fcitx5 libibus dbus python actionlint shellcheck
          # Minimal containers lack the machine ID that IBus reads at startup.
          # Initialize only this disposable CI container; no desktop is started.
          dbus-uuidgen --ensure
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          pacman -Q rust fcitx5 libibus dbus gcc cmake ninja python actionlint shellcheck | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version
          cargo --version
      - name: Check workflows
        run: |
          actionlint
          shellcheck tools/check-build.sh
      - name: Check Rust workspace and Linux adapters
        run: bash tools/check-build.sh
      - name: Build and check exported source without Git metadata
        run: |
          export_dir="$(mktemp -d "$RUNNER_TEMP/jong-source.XXXXXX")"
          trap 'rm -rf "$export_dir"' EXIT
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar --prefix=jong-bangla/ HEAD | gzip -n > "$export_dir/source.tar.gz"
          tar -xzf "$export_dir/source.tar.gz" -C "$export_dir"
          cd "$export_dir/jong-bangla"
          test ! -e .git
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo 'Exported source must be outside a Git checkout.' >&2
            exit 1
          fi
          bash tools/check-build.sh
