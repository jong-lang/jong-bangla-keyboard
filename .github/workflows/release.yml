name: Release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Check versions and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/check-release.py "$RELEASE_TAG"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  draft:
    name: Prepare complete release draft
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/draft-release.py "$RELEASE_TAG" \
            --artifacts "$RUNNER_TEMP/release-bundle" --repo "$RELEASE_REPOSITORY"
